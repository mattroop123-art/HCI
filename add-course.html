<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Matthew Roop"><title>Add course · LearnAI · Matthew Roop</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#20334d;font-family:Arial,Helvetica,sans-serif;height:100svh;display:flex;flex-direction:column}header{height:66px;flex-shrink:0;background:white;border-bottom:1px solid #e4eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.brand{display:flex;align-items:center;gap:10px;font-size:29px;font-weight:800;letter-spacing:-1px;color:#16335b;text-decoration:none}.brand svg{width:34px;height:34px}.brand span{color:#e6a52c}.back{font-size:13px;color:#245cdb;text-decoration:none}main{flex:1;min-height:0;width:100%;max-width:1300px;margin:auto;padding:24px 28px;display:flex;flex-direction:column}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.heading h1{margin:0 0 8px;color:#16335b;font-size:26px;letter-spacing:-.7px}.heading p{color:#63738b;font-size:12px;margin:0;line-height:1.6}.stage{font-size:11px;color:#245cdb;background:#edf3ff;padding:8px 12px;border-radius:20px;white-space:nowrap}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;flex:1;min-height:0}.outline,.chat{background:white;border:1px solid #e4eaf2;border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}.panel-header{padding:18px 21px;border-bottom:1px solid #e4eaf2;flex-shrink:0}.panel-header h2{margin:0;color:#16335b;font-size:16px}.panel-header p{margin:7px 0 0;font-size:11px;color:#63738b}.outline-content{padding:20px;overflow:auto;flex:1}.placeholder{font-size:13px;color:#63738b;line-height:1.8;padding:12px 0}.course-title{font-size:20px;color:#16335b;margin:0 0 14px}.dates{font-size:12px;color:#63738b;display:flex;flex-wrap:wrap;gap:10px 22px;line-height:1.8}.overview{font-size:13px;line-height:1.7;color:#63738b}.metadata{font-size:11px;color:#63738b;line-height:1.9;margin-bottom:17px}details{border:1px solid #e4eaf2;border-radius:8px;margin:10px 0;overflow:hidden}summary{padding:13px;cursor:pointer;color:#16335b;font-size:12px;font-weight:700;line-height:1.5}.children{padding:0 13px 10px}.goal{font-size:12px;line-height:1.7;color:#63738b;margin:0 0 8px}.due{font-size:10px;color:#63738b}.concepts{margin:0;padding:0 12px 12px 27px;font-size:11px;color:#63738b;line-height:1.7}.pending{font-size:11px;color:#a57815;background:#fff7dc;border-radius:6px;padding:10px;line-height:1.6}.messages{overflow:auto;flex:1;padding:20px;scroll-behavior:smooth}.message{margin-bottom:19px;max-width:94%}.message.user{margin-left:auto}.sender{font-size:10px;font-weight:700;color:#245cdb;margin:0 0 7px}.user .sender{text-align:right;color:#63738b}.bubble{white-space:pre-wrap;line-height:1.75;font-size:13px;background:#f0f5ff;border:1px solid #e2eafb;border-radius:0 12px 12px 12px;padding:13px 16px;min-height:38px}.user .bubble{background:#f6f8fc;border-color:#e4eaf2;border-radius:12px 0 12px 12px}.composer{border-top:1px solid #e4eaf2;padding:14px;display:flex;gap:10px;align-items:center;flex-shrink:0}.composer textarea{font:inherit;font-size:12px;line-height:1.6;resize:none;width:100%;height:60px;border:1px solid #d7dfed;border-radius:8px;padding:10px 12px;background:#fafbfe;color:#20334d}.composer span{font-size:17px;color:#a0afc6}.bottom{flex-shrink:0;background:white;border-top:1px solid #e4eaf2;padding:16px 4%;display:flex;align-items:center;justify-content:space-between;gap:20px}.credit{font-size:11px;color:#63738b}.add{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:8px;background:#245cdb;color:white;padding:13px 22px;cursor:pointer}.add:disabled{background:#dbe2ef;color:#7d8a9d;cursor:default}.error{font-size:12px;color:#c43b48;margin:0 0 10px}.error:empty{display:none}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #ffc857;outline-offset:3px}@media(max-width:700px){body{height:auto;min-height:100svh}header{height:60px;padding:0 18px}.brand{font-size:24px}.brand svg{width:28px;height:28px}main{padding:22px 16px}.layout{grid-template-columns:1fr}.outline-content{max-height:330px}.chat{height:520px}.stage{font-size:10px}.heading{align-items:flex-start}.bottom{position:sticky;bottom:0;padding:15px 18px}.credit{max-width:145px;line-height:1.5}}</style></head><body><header><a class="brand" href="courses.html"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#245cdb"/><path d="M9 12c5-1 8 0 11 3 3-3 6-4 11-3v17c-5-1-8 0-11 2-3-2-6-3-11-2V12Z" fill="white"/><path d="M20 15v16" stroke="#bfd0f4" stroke-width="2"/></svg><div>Learn<span>.</span></div></a><a class="back" href="courses.html">← Back to courses</a></header><main><div class="heading"><div><h1>Create a course</h1><p>Build a learning plan with LearnAI, one level at a time.</p></div><span class="stage" id="stage">Gathering goals</span></div><div class="layout"><section class="outline" aria-labelledby="outline-title"><div class="panel-header"><h2 id="outline-title">Your course outline</h2><p>Modules → sections → topics → concepts</p></div><div class="outline-content" id="outline-content"></div></section><section class="chat" aria-labelledby="chat-title"><div class="panel-header"><h2 id="chat-title">LearnAI</h2><p>Watch a guided example of planning and revising a course.</p></div><div class="messages" id="messages" role="log" aria-label="Course planning conversation"></div><div class="composer"><textarea id="composer" readonly aria-label="Simulated message to LearnAI" placeholder="The conversation will play automatically…"></textarea><span aria-hidden="true">↑</span></div></section></div></main><footer class="bottom"><span class="credit">Learn · Created by Matthew Roop</span><div><p class="error" id="save-error" role="alert"></p><button class="add" id="add" type="button" disabled>Add course →</button></div></footer><script>const course={"id": "learnai-python-foundations", "name": "Python Foundations", "start": "2026-10-12", "end": "2026-10-23", "overview": "Write small Python programs using variables, decisions, loops, and functions. Build a simple command-line number guessing game.", "background": "Complete beginner", "studyTime": "30 minutes per session", "completed": 0, "total": 4, "progress": 0, "target": 0, "pace": "on-target", "disabled": true, "modules": [{"name": "Python Basics", "goal": "Run a program and use values, input, and decisions to solve a small problem.", "sections": [{"name": "Your first program", "due": "2026-10-14", "topics": [{"name": "Running Python", "concepts": ["What does print() do?", "What is a string literal?"]}, {"name": "Variables and values", "concepts": ["What is a variable?", "How does assignment bind a name to a value?"]}]}, {"name": "Input and decisions", "due": "2026-10-16", "topics": [{"name": "User input", "concepts": ["What type of value does input() return?", "Why convert numeric input with int()?"]}, {"name": "Conditionals", "concepts": ["When does an if block run?", "What is the purpose of else?"]}]}]}, {"name": "Repetition & Functions", "goal": "Repeat actions and organize reusable code into functions, then combine them in a guessing game.", "sections": [{"name": "Loops and stopping conditions", "due": "2026-10-21", "topics": [{"name": "while loops", "concepts": ["When is a while condition evaluated?", "What makes a loop terminate?"]}, {"name": "Loop control", "concepts": ["What does break do?", "How can a loop count attempts?"]}]}, {"name": "Functions and a guessing game", "due": "2026-10-23", "topics": [{"name": "Functions", "concepts": ["What is a function parameter?", "How does return differ from print()?"]}, {"name": "Putting it together", "concepts": ["How can a function check a guess?", "How can a loop stop when a guess is correct?"]}]}]}]};const turns=[["ai", "Hi, I\u2019m LearnAI. What would you like to learn? Tell me the course name, start and end dates, your background, and what you want to be able to do.", 0], ["user", "Python Foundations, October 12\u201323, 2026. I\u2019m a complete beginner. I want to write small programs and build a number guessing game. I can study for 30 minutes per session.", 1], ["ai", "Here is the overview: learn variables, input, decisions, loops, and functions, then combine them in a guessing game. I suggest two modules:\n1. Python Basics \u2014 run a program and work with values and decisions.\n2. Repetition & Functions \u2014 repeat actions and organize reusable code.\nWould you approve these modules or change them?", 2], ["user", "Approve the two modules. Keep the course short: two guided sections per module.", 2], ["ai", "For Module 1, I propose:\n\u2022 Your first program \u2014 run Python, print text, and use variables. Due October 14.\n\u2022 Input and decisions \u2014 read input and choose a branch with if/else. Due October 16.\nApprove or modify these sections?", 3], ["user", "Modify the second section to include converting input to a number. Then approve Module 1.", 3], ["ai", "Updated. \u201cInput and decisions\u201d now includes input(), int(), and if/else. Each section has two topics with focused flashcard concepts. Module 1 is approved; its due date is October 16.", 4], ["ai", "For Module 2, I propose:\n\u2022 Loops and stopping conditions \u2014 repeat guesses safely. Due October 21.\n\u2022 Functions and a guessing game \u2014 use parameters and return values, then assemble the game. Due October 23.\nApprove or modify?", 5], ["user", "Approve. Please include break and counting the number of attempts in the loops section.", 5], ["ai", "Included. I\u2019ve added topics and individual concept cues beneath all four sections. The game will use a function to check a guess and a loop that stops on success. Module 2 is approved; its due date is October 23.", 6], ["user", "The full outline looks good. Approve the course.", 6], ["ai", "Your course is ready: 2 modules, 4 sections, 8 topics, and 16 concept cues. Review the outline on the left, then select Add course. It will appear in your course list; entering this sample course is temporarily unavailable.", 7]];
const content=document.getElementById('outline-content');const stage=document.getElementById('stage');const messages=document.getElementById('messages');const input=document.getElementById('composer');const add=document.getElementById('add');
const phases=['Gathering goals','Course details','Proposed modules','Module 1 sections','Module 1 approved','Module 2 sections','Module 2 approved','Ready to add'];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function tree(title){const details=node('details');details.append(node('summary',title));return details}
function renderOutline(phase){
 const open=new Set([...content.querySelectorAll('details[open]')].map(d=>d.querySelector('summary').textContent));content.replaceChildren();stage.textContent=phases[phase];
 if(!phase){content.append(node('p','Your course outline will take shape here as LearnAI builds it with you.','placeholder'));return}
 content.append(node('h3',course.name,'course-title'));const dates=node('div',undefined,'dates');dates.append(node('span','Starts · Oct 12, 2026'),node('span','Ends · Oct 23, 2026'));content.append(dates,node('p',course.overview,'overview'),node('div','Beginner · 30 minutes per session','metadata'));
 if(phase<2){content.append(node('p','Next: propose modules and their learning goals.','pending'));return}
 course.modules.forEach((m,i)=>{const d=tree('Module '+(i+1)+' · '+m.name);d.open=phase===2||open.has(d.querySelector('summary').textContent);const children=node('div',undefined,'children');children.append(node('p',m.goal,'goal'));
 const show=phase>=(i===0?3:5),approved=phase>=(i===0?4:6);
 if(show){children.append(node('span','Due · '+(i===0?'Oct 16':'Oct 23')+', 2026','due'));m.sections.forEach(section=>{const sec=tree(section.name);sec.open=open.has(section.name);const area=node('div',undefined,'children');area.append(node('span','Due · '+section.due,'due'));
 if(approved){section.topics.forEach(topic=>{const t=tree(topic.name);t.open=open.has(topic.name);const ul=node('ul',undefined,'concepts');topic.concepts.forEach(c=>ul.append(node('li',c)));t.append(ul);area.append(t)})}else area.append(node('p','Awaiting approval before topics and concepts are added.','pending'));
 sec.append(area);children.append(sec)})}else children.append(node('p','Sections will be proposed after the preceding module is approved.','pending'));
 d.append(children);content.append(d)});
}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function type(text,set){const duration=Math.min(2300,Math.max(550,text.length*8));const begin=performance.now();await new Promise(resolve=>{function frame(now){const fraction=Math.min(1,(now-begin)/duration);set(text.slice(0,Math.ceil(text.length*fraction)));if(fraction<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}
async function play(){renderOutline(0);await wait(500);for(const [role,text,phase] of turns){const message=node('div',undefined,'message '+role);message.append(node('p',role==='ai'?'LearnAI':'Matthew Roop','sender'));const bubble=node('div','', 'bubble');message.append(bubble);
 if(role==='user'){await type(text,value=>input.value=value);await wait(250);input.value='';messages.append(message);bubble.textContent=text;}
 else{messages.append(message);await type(text,value=>{bubble.textContent=value;messages.scrollTop=messages.scrollHeight})}
 messages.scrollTop=messages.scrollHeight;renderOutline(phase);await wait(400)}
 add.disabled=false;input.placeholder='Course ready to add';stage.textContent='Ready to add';}
add.addEventListener('click',()=>{try{sessionStorage.setItem('learn-just-added-course',JSON.stringify(course));window.location.href='courses.html?added=1';}catch{document.getElementById('save-error').textContent='Your browser could not pass the course to the course list. Allow session storage and try again.'}});
play();</script></body></html>
