background:var(--color)}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--tint);color:var(--color)}.badge:before{content:'';width:6px;height:6px;background:currentColor;border-radius:50%}.behind{--color:#c43b48;--tint:#fff0f1}.on-target{--color:#245cdb;--tint:#edf3ff}.ahead{--color:#23815a;--tint:#eaf7f0}.enter{display:inline-block;text-decoration:none;border:1px solid #d6e2fb;background:#f0f5ff;color:#245cdb;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.enter:hover{background:#e3ecff}.legend{display:flex;flex-wrap:wrap;gap:20px;align-items:center;color:#63738b;font-size:11px;margin:19px 2px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:var(--color)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:white;border-top:1px solid #e4eaf2;flex-shrink:0;padding:22px 6%;display:flex;align-items:center;justify-content:space-between;gap:20px}.credit{font-size:11px;color:#63738b}.add{display:inline-block;text-decoration:none;border:0;border-radius:8px;background:#245cdb;color:white;padding:13px 20px;font-size:13px;font-weight:700;cursor:pointer}.add:hover{background:#1947ae}button:focus-visible,a:focus-visible{outline:3px solid #ffc857;outline-offset:3px}dialog{border:1px solid #e4eaf2;border-radius:16px;padding:28px;color:#20334d;width:min(430px,calc(100% - 32px));box-shadow:0 18px 60px #16335b22}dialog::backdrop{background:#16335b55}dialog h2{font-size:22px;color:#16335b;margin:0 0 12px}dialog p{font-size:14px;color:#63738b;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}input,select{width:100%;padding:11px;border:1px solid #ccd6e5;border-radius:7px;background:white;color:#20334d}input:focus,select:focus{outline:2px solid #245cdb}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.cancel{border:1px solid #d9e1ef;background:white;color:#63738b;border-radius:8px;padding:11px 16px;cursor:pointer}.message{font-size:13px;color:#63738b;min-height:18px;margin-top:20px}@media(max-width:700px){header{height:65px;padding:0 20px}.account{gap:12px;font-size:11px}.brand{font-size:25px}.brand svg{width:28px;height:28px}main{padding:30px 18px 120px}h1{font-size:29px}th,td{padding:16px 14px}.table-card table{min-width:590px}.bottom{padding:18px 20px}.credit{max-width:130px;line-height:1.5}.legend{gap:14px}.subtitle{line-height:1.6}}

<main><p class="eyebrow">Your learning space</p><h1>Your courses</h1><p class="subtitle">Pick up where you left off and keep moving forward.</p><div class="table-card"><table aria-label="Courses and learning progress"><thead><tr><th scope="col">Course</th><th scope="col">Progress</th><th scope="col">Pace</th><th scope="col">Action</th></tr></thead><tbody id="course-list"></tbody></table></div><div class="legend" aria-label="Pace color key"><span><i class="dot behind"></i>Behind</span><span><i class="dot on-target"></i>On target</span><span><i class="dot ahead"></i>Ahead</span><span><i style="height:12px;border-left:2px dotted #52637e"></i>Target</span></div></main>
<footer class="bottom"><span class="credit">Learn · Created by Matthew Roop</span><a href="add-course.html" class="add">＋ Add new course</a></footer>
<script>
const courses=[{name:'Data Structures and Algorithms 2',completed:37,total:88,progress:42,target:42,pace:'on-target',href:'dsa2.html'},{name:'Human Computer Interfaces',completed:60,total:88,progress:68,target:42,pace:'ahead',href:'hci.html'}];
try{const stored=sessionStorage.getItem('learn-just-added-course');sessionStorage.removeItem('learn-just-added-course');if(new URLSearchParams(window.location.search).get('added')==='1'&&stored){const c=JSON.parse(stored);if(c&&typeof c.name==='string'&&Number.isInteger(c.completed)&&Number.isInteger(c.total)&&c.total>0&&c.disabled===true)courses.push({...c,pace:'on-target',target:0,disabled:true});}if(new URLSearchParams(window.location.search).has('added'))history.replaceState(null,'','courses.html');}catch{}
const labels={'behind':'Behind','on-target':'On target','ahead':'Ahead'};
const list=document.getElementById('course-list');
function renderCourses(){
 list.replaceChildren();
 courses.forEach(course=>{
  const row=document.createElement('tr');row.className=course.pace;
  const name=document.createElement('td');name.className='course-name';name.textContent=course.name;
  const progress=document.createElement('td');progress.className='progress-cell';
  const top=document.createElement('div');top.className='progress-top';
  const percent=document.createElement('strong');percent.textContent=course.progress+'%';
  const complete=document.createElement('span');complete.textContent='Target '+course.target+'%';percent.textContent=Math.round(course.completed/course.total*100)+'% ('+course.completed+'/'+course.total+')';top.append(percent,complete);
  const track=document.createElement('div');track.className='track';track.setAttribute('role','progressbar');track.setAttribute('aria-label',course.name+' progress');track.setAttribute('aria-valuenow',course.progress);track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');
  const fill=document.createElement('div');fill.className='fill';fill.style.width=course.progress+'%';track.append(fill);const marker=document.createElement('span');marker.className='target-marker';marker.style.left=course.target+'%';marker.setAttribute('aria-hidden','true');track.append(marker);track.setAttribute('aria-valuetext',course.progress+'% complete; target '+course.target+'%');progress.append(track,top);
  const pace=document.createElement('td');const badge=document.createElement('span');badge.className='badge';badge.textContent=labels[course.pace];pace.append(badge);
  const action=document.createElement('td');const button=document.createElement(course.disabled?'button':'a');button.className='enter';if(course.disabled){button.type='button';button.disabled=true;button.textContent='Enter course';button.title='Entering this sample course is temporarily unavailable.';button.setAttribute('aria-label','Enter '+course.name+' — temporarily unavailable');}else{button.href=course.href;button.textContent='Enter course →';button.setAttribute('aria-label','Enter '+course.name);}action.append(button);
  row.append(name,progress,pace,action);list.append(row);
 });
}
renderCourses();
</script></body></html>
